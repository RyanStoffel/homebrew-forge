name: Test Homebrew artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    name: Audit and install formula
    runs-on: macos-14
    env:
      TAP: RyanStoffel/forge-ci
    steps:
      - uses: actions/checkout@v4
      - name: Stage repository as a local tap
        run: |
          tap_path="$(brew --repository)/Library/Taps/ryanstoffel/homebrew-forge-ci"
          mkdir -p "$(dirname "$tap_path")"
          ln -s "$GITHUB_WORKSPACE" "$tap_path"
      - name: Audit formula
        run: brew audit --strict --online "$TAP/forge"
      - name: Install formula
        run: brew install --formula "$TAP/forge"
      - name: Run formula test
        run: brew test "$TAP/forge"

  cask:
    name: Audit and install desktop app
    runs-on: macos-14
    env:
      TAP: RyanStoffel/forge-ci
    steps:
      - uses: actions/checkout@v4
      - name: Stage repository as a local tap
        run: |
          tap_path="$(brew --repository)/Library/Taps/ryanstoffel/homebrew-forge-ci"
          mkdir -p "$(dirname "$tap_path")"
          ln -s "$GITHUB_WORKSPACE" "$tap_path"
      - name: Audit cask
        run: brew audit --cask --strict --online "$TAP/forge-app"
      - name: Install cask
        run: brew install --cask "$TAP/forge-app"
      - name: Verify application bundle
        run: |
          test -d /Applications/Forge.app
          plutil -lint /Applications/Forge.app/Contents/Info.plist
          codesign --verify --deep --strict /Applications/Forge.app
          cp /Applications/Forge.app/Contents/MacOS/forge /tmp/forge-version-test
          chmod 755 /tmp/forge-version-test
          /tmp/forge-version-test --version
